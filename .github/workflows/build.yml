
name: 170BOOKS - ZIP to APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 170books-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract ZIP and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP archive not found in repository root!"
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/170books-unpacked"

          python3 - "$ZIP_FILE" "$RUNNER_TEMP/170books-unpacked" <<'PY'
          import sys, zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (destination / item.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit("Unsafe path in ZIP archive")
              z.extractall(destination)

          print("ZIP successfully extracted!")
          PY

      - name: Find Android project
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/170books-unpacked"

          PROJECT=$(find "$ROOT" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "::error::settings.gradle or settings.gradle.kts not found!"
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ] && \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "::error::Android app module not found!"
            exit 1
          fi

          echo "Android project found: $PROJECT"

          cp -a "$PROJECT/." "$GITHUB_WORKSPACE/"

          echo "Project files:"
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleRelease
          else
            curl -fL https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -o "$RUNNER_TEMP/gradle.zip"
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            "$RUNNER_TEMP/gradle-8.7/bin/gradle" \
              --no-daemon --stacktrace :app:assembleRelease
          fi

      - name: Find and prepare APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK was not created!"
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/170BOOKS.apk

          ls -lh release/170BOOKS.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 170BOOKS-APK
          path: release/170BOOKS.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 170BOOKS v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: release/170BOOKS.apk
          
